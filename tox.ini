[tox]
envlist =
    py{312,313}-dj52
    py{312,313}-dj60
    lint
    type
    build
isolated_build = true

[testenv]
extras = test
commands = pytest {posargs}

[testenv:py312-dj52]
deps = Django>=5.2,<5.3

[testenv:py313-dj52]
deps = Django>=5.2,<5.3

[testenv:py312-dj60]
deps = Django>=6.0,<6.1

[testenv:py313-dj60]
deps = Django>=6.0,<6.1

[testenv:lint]
deps = ruff>=0.6
commands =
    ruff check admin_extended
    ruff format --check admin_extended

[testenv:type]
extras = dev
commands = mypy admin_extended

[testenv:build]
deps = build>=1.2
commands = python -m build --sdist --wheel
